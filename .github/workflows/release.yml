name: Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.8-beta.6 or 1.0.8)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Prepare Version and Release Notes
        shell: pwsh
        run: |
          $inputVersion = "${{ github.event.inputs.version }}".Trim()
          $currentPkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version

          if ($inputVersion) {
            $targetVersion = $inputVersion -replace '^v',''
            Write-Host "Updating package.json version to $targetVersion"
            # Avoid PowerShell ConvertTo-Json rewriting package.json structure
            node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version=process.argv[1]; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');" $targetVersion
          } else {
            $targetVersion = $currentPkgVersion
          }

          Write-Host "Target Version: $targetVersion"

          # electron-builder does NOT interpolate ${version} in releaseNotesFile.
          # Always materialize a stable .release-notes.md path for publish.
          $versionedNotes = ".release-notes-v${targetVersion}.md"
          $stableNotes = ".release-notes.md"

          if (Test-Path $versionedNotes) {
            Write-Host "Using versioned notes: $versionedNotes"
            Copy-Item -Force $versionedNotes $stableNotes
          } elseif (Test-Path $stableNotes) {
            Write-Host "Using existing $stableNotes"
          } else {
            Write-Host "No release notes file found. Generating changelog from git history..."
            $gitNotes = git log -n 10 --oneline --no-merges
            $notesContent = @"
## Brown AI v${targetVersion} (Desktop & Mobile)

### Recent Changes
$($gitNotes -join "`n")
"@
            Set-Content -Path $stableNotes -Value $notesContent -Encoding utf8
          }

          # Ensure unified download section is present for Brown-Releases visitors
          $notesText = Get-Content -Raw $stableNotes
          if ($notesText -notmatch 'Brown-AI-Mobile') {
            $downloadSection = @"

## Download Assets

### Windows Desktop (v${targetVersion})
- **Setup Installer**: ``Brown-AI-Setup-v${targetVersion}.exe`` (Recommended)
- **Portable Edition**: ``Brown-AI-v${targetVersion}.exe``

### Android Mobile
- **Direct APK**: ``Brown-AI-Mobile-v1.0.0.apk`` (attach/upload separately if not already on this release)
"@
            Add-Content -Path $stableNotes -Value $downloadSection -Encoding utf8
          }

          Write-Host "Release notes prepared in $stableNotes"
          Get-Item $stableNotes | Format-List FullName, Length

      - name: Build & Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Update release.json manifest for Website
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v$version" }
          # GitHub release assets use hyphens (spaces are rewritten on upload)
          $relJson = @{
            version = $version
            tagName = $tag
            releaseDate = (Get-Date -Format "yyyy-MM-dd")
            setupUrl = "https://github.com/vedantwankhade123/Brown-Releases/releases/download/$tag/Brown-AI-Setup-v$version.exe"
            portableUrl = "https://github.com/vedantwankhade123/Brown-Releases/releases/download/$tag/Brown-AI-v$version.exe"
            mobileApkUrl = "https://github.com/vedantwankhade123/Brown-Releases/releases/download/$tag/Brown-AI-Mobile-v1.0.0.apk"
            setupName = "Brown-AI-Setup-v$version.exe"
            portableName = "Brown-AI-v$version.exe"
            mobileApkName = "Brown-AI-Mobile-v1.0.0.apk"
          }
          if (Test-Path "Ultron Website") {
            New-Item -ItemType Directory -Force -Path "Ultron Website/public" | Out-Null
            $relJson | ConvertTo-Json -Depth 5 | Set-Content "Ultron Website/public/release.json" -Encoding UTF8
            $relJson | ConvertTo-Json -Depth 5 | Set-Content "Ultron Website/release.json" -Encoding UTF8
            Write-Host "Updated website release.json for version $version"
          } else {
            Write-Host "Website folder not in runner root, skipping release.json update."
          }

      - name: Summary
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "Successfully published Brown AI v$version to GitHub Releases!"
          Write-Host "Installer: Brown-AI-Setup-v$version.exe"
          Write-Host "Portable:  Brown-AI-v$version.exe"
          Write-Host "Mobile:    Brown-AI-Mobile-v1.0.0.apk (unified release asset)"
