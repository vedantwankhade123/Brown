name: Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify tag matches package.json (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}" -replace '^v',''
          if ($pkgVersion -ne $tagVersion) {
            Write-Error "Git tag v$tagVersion does not match package.json version $pkgVersion. Bump package.json first, then tag."
          }
          Write-Host "Publishing Ultron AI v$pkgVersion"

      - name: Build and publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Release summary
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "Published v$version to GitHub Releases."
          Write-Host "Assets: Ultron.AI.Setup.$version.exe, Ultron.AI.$version.exe, latest.yml"
          Write-Host "Installed apps will detect the update via electron-updater."
