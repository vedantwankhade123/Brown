name: Release Windows Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver package version (e.g. 1.0.2). Leave empty to use git tag or package.json.'
        required: false
        default: ''
      release_tag:
        description: 'GitHub release tag (e.g. v1.0.2). Leave empty to use v{version}.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release-desktop:
    name: Build & Release Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Prepare Version and Release Metadata
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: node scripts/prepare-release-meta.js

      - name: Build Windows Installers
        run: npm run dist:ci

      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          mver="$MARKETING_VERSION"

          setup=""
          portable=""
          for f in dist/*.exe; do
            if [ ! -f "$f" ]; then continue; fi
            base="$(basename "$f")"
            case "$base" in
              *Setup*.exe) if [ -z "$setup" ]; then setup="$f"; fi ;;
              *) if [ -z "$portable" ]; then portable="$f"; fi ;;
            esac
          done

          if [ -z "$setup" ] || [ -z "$portable" ]; then
            echo "Built files in dist:"
            ls -la dist
            echo "::error::Could not find Setup/Portable EXEs for version $mver"
            exit 1
          fi

          # Permanent aliases keep the website and README links version-free.
          cp -f "$setup" "dist/Brown-AI-Setup-v${mver}.exe"
          cp -f "$portable" "dist/Brown-AI-v${mver}.exe"
          cp -f "$setup" "dist/Brown-AI-Setup.exe"
          cp -f "$portable" "dist/Brown-AI-Portable.exe"

          upload_files=(
            "dist/Brown-AI-Setup-v${mver}.exe"
            "dist/Brown-AI-v${mver}.exe"
            "dist/Brown-AI-Setup.exe"
            "dist/Brown-AI-Portable.exe"
          )
          if [ -f dist/latest.yml ]; then
            upload_files+=("dist/latest.yml")
          fi

          echo "Uploading files to release $tag:"
          printf '  %s\n' "${upload_files[@]}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists - uploading/replacing assets"
            gh release upload "$tag" "${upload_files[@]}" --clobber
            gh release edit "$tag" --title "Brown AI Desktop v${mver}" --notes-file .release-notes.md
          else
            echo "Creating release $tag"
            gh release create "$tag" "${upload_files[@]}" \
              --title "Brown AI Desktop v${mver}" \
              --notes-file .release-notes.md
          fi

          echo "Successfully published Windows Desktop assets to $tag!"
